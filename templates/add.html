<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новая заявка</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app-body">

    <header class="app-header">
        <a href="/gates" class="logo-link">
            <img src="/static/img/logo.png" alt="Quantum" class="logo">
        </a>
        <h1 class="app-title">Новая заявка</h1>
    </header>

    <main class="page-content">
        {% if gate %}
        <form class="add-form" onsubmit="return false;">

            <section class="form-section">
                <h2 class="section-title">Параметры алгоритма</h2>

                <label class="field-label" for="title">Название</label>
                <input type="text" id="title" name="title"
                       value="{{ gate.title }}" class="field-input">

                <label class="field-label" for="description">Описание</label>
                <textarea id="description" name="description"
                          rows="4" class="field-input">{{ gate.description }}</textarea>

                <label class="field-label" for="angle_x">Угол X (0–180)</label>
                <input type="number" id="angle_x" name="angle_x"
                       min="0" max="180" value="{{ gate.angle_x }}" class="field-input">

                <label class="field-label" for="angle_y">Угол Y (0–180)</label>
                <input type="number" id="angle_y" name="angle_y"
                       min="0" max="180" value="{{ gate.angle_y }}" class="field-input">

                <label class="field-label" for="status">Статус</label>
                <select id="status" name="status" class="field-input">
                    <option>Черновик</option>
                    <option>В работе</option>
                    <option>Завершена</option>
                    <option>Отклонена</option>
                </select>

                <button type="button" class="btn-primary">Сохранить (недоступно)</button>
            </section>

        </form>
        {% else %}
        <p class="empty-msg">Черновик не найден.</p>
        {% endif %}
    </main>

    <nav class="tabbar">
        <a href="/gates/1" class="tab">Лента</a>
        <a href="/add" class="tab tab-active">Добавить</a>
        <a href="/gates" class="tab">Плитка</a>
    </nav>

</body>
</html>
