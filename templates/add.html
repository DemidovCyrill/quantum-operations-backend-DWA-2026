<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ "Публикация" if gate else "Новая заявка" }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app-body">

    <header class="app-header">
        <a href="/gates" class="logo-link">
            <img src="/static/img/logo.png" alt="Quantum" class="logo">
        </a>
        <h1 class="app-title">{{ "Публикация" if gate else "Новая заявка" }}</h1>
    </header>

    <main class="page-content">

        {% if not gate %}
        <!-- Шаг 1: черновика нет — форма создания -->
        <form method="post" action="/gates" class="add-form">
            <section class="form-section">
                <h2 class="section-title">Шаг 1. Создание черновика</h2>

                <label class="field-label" for="title">Название</label>
                <input type="text" id="title" name="title" required class="field-input">

                <label class="field-label" for="image_url">Фото (имя файла в MinIO)</label>
                <input type="text" id="image_url" name="image_url"
                       placeholder="pauli_x.png" class="field-input">

                <label class="field-label" for="video_url">Видео (имя файла в MinIO)</label>
                <input type="text" id="video_url" name="video_url"
                       placeholder="pauli_x.mp4" class="field-input">

                <button type="submit" class="btn-primary">Далее</button>
            </section>
        </form>

        {% else %}
        <!-- Шаг 2: черновик есть — форма публикации -->
        <form method="post" action="/gates/{{ gate.id }}/publish" class="add-form">
            <section class="form-section">
                <h2 class="section-title">Шаг 2. Публикация</h2>

                <label class="field-label">Название</label>
                <input type="text" value="{{ gate.title }}" class="field-input" disabled>

                <label class="field-label" for="summary">Краткое описание</label>
                <textarea id="summary" name="summary" rows="4" required
                          class="field-input">{{ gate.summary or '' }}</textarea>

                <label class="field-label" for="angle_x">Угол X (0–180)</label>
                <input type="number" id="angle_x" name="angle_x" min="0" max="180"
                       value="{{ gate.angle_x }}" class="field-input">

                <label class="field-label" for="angle_y">Угол Y (0–180)</label>
                <input type="number" id="angle_y" name="angle_y" min="0" max="180"
                       value="{{ gate.angle_y }}" class="field-input">

                <button type="submit" class="btn-primary">Опубликовать</button>
            </section>
        </form>
        {% endif %}

    </main>

    <nav class="tabbar">
        <a href="/gates/3" class="tab">Лента</a>
        <a href="/add" class="tab tab-active">Добавить</a>
        <a href="/gates" class="tab">Плитка</a>
    </nav>

</body>
</html>
